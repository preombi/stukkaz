<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stukkaz - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <form id="login" onsubmit="entrar(); return false">
    <div class="logo">
        <img src="assets/img/stukkazlogo.png" alt="Logo Stukkaz" class="logoSK">
        <h2>Bem-vindo ao Stukkaz</h2>
    </div>

    <label for="emailLogin">E-mail</label>
    <input type="email" id="emailLogin" placeholder="nome@gmail.com" required>

    <label for="senhaLogin">Senha</label>
    <input type="password" id="senhaLogin" placeholder="........." required>

    <button type="submit">Entrar</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/login.js"></script>
</body>
</html>
